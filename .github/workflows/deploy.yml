name: Deploy Unio site to Pages

# Builds the Astro site in site/ and publishes it to
# https://danielmevit.github.io/unio

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
      # The site reads the version from the newest CHANGELOG heading at build
      # time; without this the page keeps advertising the previous release.
      - "CHANGELOG.md"
  workflow_dispatch:

# Least privilege: the build job (which runs npm install) only reads the repo;
# only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # npm install runs package scripts; keep the token out of .git/config.
          persist-credentials: false

      - name: Build the site
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          package-manager: npm
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
